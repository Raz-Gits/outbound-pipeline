[project]
name = "outbound-pipeline"
version = "0.1.0"
description = "Source-agnostic lead enrichment: cost-ordered provider cascade, verified-only output, append-only suppression, report-only shipping."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
outbound = "outbound.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
